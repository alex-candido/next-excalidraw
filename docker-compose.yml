services:
  db:
    image: postgres:17-alpine
    container_name: nextexcalidraw_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextexcalidraw_db
    ports:
      - "5438:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
